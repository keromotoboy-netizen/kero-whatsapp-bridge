name: CRM tests

on:
  push:
    branches:
      - crm-full-auto-20261006
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --check crm-store.mjs
      - run: node --check crm-ai.mjs
      - run: node --check server.mjs
      - run: node --test crm-store.test.mjs crm-ai.test.mjs
